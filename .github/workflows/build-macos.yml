name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build Dropfin.app
        run: ./scripts/bundle-macos.sh

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: Dropfin-mac
          path: dist/Dropfin.dmg

      - name: Publish to the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Dropfin.dmg dist/Dropfin-mac.zip \
            --title "Dropfin — latest build" \
            --target "$GITHUB_SHA" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download **Dropfin.dmg**, open it, and drag Dropfin into Applications."
