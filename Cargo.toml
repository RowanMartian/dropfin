[package]
name = "dropfin"
version = "1.0.1"
edition = "2021"
description = "Finder-style SFTP file manager for getting media onto your Jellyfin server"
publish = false

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
futures = "0.3"
russh = "0.65"
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand = "0.9"
anyhow = "1"
if-addrs = "0.15"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
rfd = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
